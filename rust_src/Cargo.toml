[package]
name = "dmtl_net"
version = "0.1.0"
edition = "2021"
authors = ["Lukash"]
description = "Fast native A2S networking module for DMTLauncher"
repository = "https://github.com/69-Lukash/DMTLauncher"
license = "MIT"

[lib]
name = "dmtl_net"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.0", features = ["extension-module", "abi3-py311"] }